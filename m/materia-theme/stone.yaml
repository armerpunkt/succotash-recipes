name        : materia-theme
version     : "20210322"
release     : 1
homepage    : https://github.com/nana-4/materia-theme
upstreams   :
    - https://github.com/nana-4/materia-theme/archive/refs/tags/v20210322.tar.gz : 4460af612cd70242543ac71023f8963eea39be059486e9ebe58b3846be74bcb5
summary     : A Material Design theme for GNOME/GTK based desktop environments
description : |
    Materia is a Material Design theme for GNOME/GTK based desktop environments. It supports GTK 2, GTK 3, GTK 4, GNOME Shell, Budgie, Cinnamon, MATE, Unity, Xfce, LightDM, GDM, Chrome theme, etc.
license     :
    - GPL-2.0-or-later
builddeps   :
    - binary(gnome-shell)
    - binary(sassc)
    - pkgconfig(gtk4)
setup       : |
    %meson
build       : |
    %meson_build
install     : |
    %meson_install
